<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Token Live Monitor dashboard schematic preview with synthetic demo data">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12233d"/><stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#38bdf8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#070d1a"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#bar)" opacity=".8"/>

  <g font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <!-- header -->
    <text x="40" y="58" font-size="27" font-weight="bold" fill="#e6f1ff">Token 消耗看板</text>
    <text x="40" y="82" font-size="13" fill="#6b8db3">数据时间 2026-01-01 10:00 · 合成示例数据</text>
    <rect x="252" y="66" width="112" height="22" rx="11" fill="#0e2036" stroke="#2a4a75"/>
    <circle cx="266" cy="77" r="4" fill="#34d399"/>
    <text x="278" y="81" font-size="11" fill="#7ff0e2">LIVE · 实时统计</text>

    <text x="1050" y="76" font-size="12" fill="#6b8db3">时间窗口</text>
    <rect x="1120" y="58" width="150" height="30" rx="8" fill="#0b1930" stroke="#2a4a75"/>
    <text x="1132" y="78" font-size="13" fill="#e6f1ff">今天 · 1 天  ▾</text>
    <text x="1292" y="76" font-size="12" fill="#6b8db3">界面风格</text>
    <rect x="1360" y="58" width="200" height="30" rx="8" fill="#0b1930" stroke="#2a4a75"/>
    <text x="1372" y="78" font-size="13" fill="#7ff0e2">深空蓝 · 科技  ▾</text>

    <!-- KPI cards -->
    <g>
      <g transform="translate(40,108)"><rect width="212" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">合计 Token</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#e6f1ff">12.8 M</text></g>
      <g transform="translate(264,108)"><rect width="212" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">日均（有数据天）</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#e6f1ff">6.4 M</text></g>
      <g transform="translate(488,108)"><rect width="212" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">会话</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#e6f1ff">5</text></g>
      <g transform="translate(712,108)"><rect width="212" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">轮次</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#e6f1ff">296</text></g>
      <g transform="translate(936,108)"><rect width="212" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">输入 / 输出比</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#e6f1ff">146:1</text></g>
      <g transform="translate(1160,108)"><rect width="212" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">缓存命中率</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#7ff0e2">96.5%</text></g>
      <g transform="translate(1384,108)"><rect width="176" height="86" rx="10" fill="url(#card)" stroke="#1d3557"/><text x="16" y="28" font-size="12" fill="#6b8db3">预估金额（元）</text><text x="16" y="64" font-size="26" font-weight="bold" fill="#e6f1ff">¥36.2</text></g>
    </g>

    <!-- left card: workspaces -->
    <g transform="translate(40,214)">
      <rect width="740" height="300" rx="10" fill="url(#card)" stroke="#1d3557"/>
      <text x="18" y="30" font-size="16" font-weight="bold" fill="#e6f1ff">工作空间活跃分布 · 按会话</text>
      <text x="18" y="52" font-size="11" fill="#6b8db3">示例任务 A / B / C · 合成数据</text>
      <g font-size="12">
        <text x="18" y="96" fill="#9ab9dc">示例任务 A</text><rect x="150" y="84" width="440" height="14" rx="4" fill="#1b3a5c"/><rect x="150" y="84" width="300" height="14" rx="4" fill="#38bdf8"/><text x="610" y="96" fill="#7ff0e2">48.7%</text>
        <text x="18" y="140" fill="#9ab9dc">示例任务 B</text><rect x="150" y="128" width="440" height="14" rx="4" fill="#1b3a5c"/><rect x="150" y="128" width="192" height="14" rx="4" fill="#5eead4"/><text x="610" y="140" fill="#7ff0e2">31.0%</text>
        <text x="18" y="184" fill="#9ab9dc">示例任务 C</text><rect x="150" y="172" width="440" height="14" rx="4" fill="#1b3a5c"/><rect x="150" y="172" width="72" height="14" rx="4" fill="#a78bfa"/><text x="610" y="184" fill="#7ff0e2">11.3%</text>
        <text x="18" y="228" fill="#9ab9dc">示例任务 D</text><rect x="150" y="216" width="440" height="14" rx="4" fill="#1b3a5c"/><rect x="150" y="216" width="56" height="14" rx="4" fill="#f472b6"/><text x="610" y="228" fill="#7ff0e2">8.7%</text>
      </g>
      <g fill="#38bdf8" opacity=".7">
        <rect x="18" y="256" width="12" height="12" rx="3"/><rect x="34" y="256" width="12" height="12" rx="3" opacity=".7"/>
        <rect x="50" y="256" width="12" height="12" rx="3" opacity=".5"/><rect x="66" y="256" width="12" height="12" rx="3" opacity=".35"/>
        <rect x="82" y="256" width="12" height="12" rx="3" opacity=".8"/><rect x="98" y="256" width="12" height="12" rx="3" opacity=".25"/>
      </g>
    </g>

    <!-- left card: request size -->
    <g transform="translate(40,528)">
      <rect width="740" height="290" rx="10" fill="url(#card)" stroke="#1d3557"/>
      <text x="18" y="30" font-size="16" font-weight="bold" fill="#e6f1ff">单次请求大小分布</text>
      <text x="18" y="52" font-size="11" fill="#6b8db3">每模型 50% / 90% 分位 · 合成数据</text>
      <path d="M40 220 C120 215 160 120 240 118 C320 116 350 205 430 208 C510 211 550 145 640 150 C680 152 710 200 720 205 L720 250 L40 250 Z" fill="url(#ridge)" stroke="#38bdf8" stroke-width="2"/>
      <path d="M40 250 C130 246 180 190 260 188 C340 186 380 235 460 238 C540 241 590 205 720 220" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
      <g stroke="#2a4a75"><path d="M40 250H720"/></g>
      <g font-size="11" fill="#6b8db3"><text x="40" y="272">0</text><text x="350" y="272">请求大小</text><text x="670" y="272">大</text></g>
    </g>

    <!-- right card: heatmap -->
    <g transform="translate(800,214)">
      <rect width="760" height="216" rx="10" fill="url(#card)" stroke="#1d3557"/>
      <text x="18" y="30" font-size="16" font-weight="bold" fill="#e6f1ff">日活分布</text>
      <g>
        <g fill="#154b6b"><rect x="18" y="52" width="18" height="18" rx="3"/><rect x="40" y="52" width="18" height="18" rx="3"/><rect x="62" y="52" width="18" height="18" rx="3"/></g>
        <g fill="#2aacc0"><rect x="84" y="52" width="18" height="18" rx="3"/><rect x="106" y="52" width="18" height="18" rx="3"/></g>
        <g fill="#7ff0e2"><rect x="128" y="52" width="18" height="18" rx="3"/></g>
        <g fill="#10314f"><rect x="18" y="74" width="18" height="18" rx="3"/><rect x="40" y="74" width="18" height="18" rx="3"/></g>
        <g fill="#1f8ba1"><rect x="62" y="74" width="18" height="18" rx="3"/><rect x="84" y="74" width="18" height="18" rx="3"/></g>
        <g fill="#46d3d5"><rect x="106" y="74" width="18" height="18" rx="3"/><rect x="128" y="74" width="18" height="18" rx="3"/></g>
      </g>
      <g transform="translate(170,52)">
        <g fill="#154b6b"><rect x="0" y="0" width="18" height="18" rx="3"/><rect x="22" y="0" width="18" height="18" rx="3"/></g>
        <g fill="#2aacc0"><rect x="44" y="0" width="18" height="18" rx="3"/><rect x="66" y="0" width="18" height="18" rx="3"/><rect x="88" y="0" width="18" height="18" rx="3"/></g>
        <g fill="#1a6a86"><rect x="0" y="22" width="18" height="18" rx="3"/><rect x="22" y="22" width="18" height="18" rx="3"/></g>
        <g fill="#7ff0e2"><rect x="44" y="22" width="18" height="18" rx="3"/><rect x="66" y="22" width="18" height="18" rx="3"/></g>
      </g>
      <text x="18" y="132" font-size="11" fill="#6b8db3">20 分钟粒度 · 色阶对数插值</text>
      <g font-size="11" fill="#6b8db3"><text x="18" y="170">00:00</text><text x="180" y="170">08:00</text><text x="360" y="170">16:00</text><text x="540" y="170">24:00</text></g>
      <g fill="#38bdf8"><circle cx="640" cy="164" r="6"/><circle cx="662" cy="164" r="6" fill="#5eead4"/><circle cx="684" cy="164" r="6" fill="#a78bfa"/></g>
      <text x="700" y="168" font-size="11" fill="#6b8db3">模型</text>
    </g>

    <!-- right card: ridge -->
    <g transform="translate(800,444)">
      <rect width="760" height="176" rx="10" fill="url(#card)" stroke="#1d3557"/>
      <text x="18" y="30" font-size="16" font-weight="bold" fill="#e6f1ff">0–24 时分布 · 按模型</text>
      <path d="M18 130 C90 126 130 70 200 72 C270 74 300 122 370 124 C440 126 480 88 550 90 C620 92 660 128 740 130 L740 150 L18 150 Z" fill="url(#ridge)" stroke="#38bdf8" stroke-width="2"/>
      <path d="M18 148 C110 146 160 116 240 118 C320 120 360 142 440 144 C520 146 570 126 650 130 C690 132 720 144 740 146" fill="none" stroke="#e879f9" stroke-width="2" opacity=".8"/>
      <g stroke="#2a4a75"><path d="M18 150H740"/></g>
      <g font-size="10" fill="#6b8db3"><text x="18" y="168">0h</text><text x="360" y="168">12h</text><text x="700" y="168">24h</text></g>
    </g>

    <!-- right card: stacked bars -->
    <g transform="translate(800,634)">
      <rect width="760" height="184" rx="10" fill="url(#card)" stroke="#1d3557"/>
      <text x="18" y="30" font-size="16" font-weight="bold" fill="#e6f1ff">每日模型用量比例</text>
      <g>
        <rect x="40" y="122" width="34" height="30" fill="#38bdf8"/><rect x="40" y="102" width="34" height="20" fill="#5eead4"/>
        <rect x="120" y="112" width="34" height="40" fill="#38bdf8"/><rect x="120" y="88" width="34" height="24" fill="#a78bfa"/>
        <rect x="200" y="132" width="34" height="20" fill="#38bdf8"/><rect x="200" y="112" width="34" height="20" fill="#5eead4"/>
        <rect x="280" y="100" width="34" height="52" fill="#38bdf8"/><rect x="280" y="74" width="34" height="26" fill="#a78bfa"/>
        <rect x="360" y="118" width="34" height="34" fill="#38bdf8"/><rect x="360" y="96" width="34" height="22" fill="#5eead4"/>
        <rect x="440" y="108" width="34" height="44" fill="#38bdf8"/><rect x="440" y="82" width="34" height="26" fill="#a78bfa"/>
        <rect x="520" y="126" width="34" height="26" fill="#38bdf8"/><rect x="520" y="108" width="34" height="18" fill="#5eead4"/>
        <rect x="600" y="96" width="34" height="56" fill="#38bdf8"/><rect x="600" y="70" width="34" height="26" fill="#a78bfa"/>
        <rect x="680" y="114" width="34" height="38" fill="#38bdf8"/><rect x="680" y="92" width="34" height="22" fill="#5eead4"/>
      </g>
      <g stroke="#2a4a75"><path d="M30 152H740"/></g>
      <text x="18" y="174" font-size="11" fill="#6b8db3">x = 日期（最新在右）· y = 当日 Token · 颜色 = 模型</text>
    </g>

    <!-- live badge -->
    <g transform="translate(1400,846)">
      <rect width="160" height="30" rx="15" fill="#0b2842" stroke="#5eead4" stroke-opacity=".5"/>
      <circle cx="20" cy="15" r="4" fill="#7ff0e2"/>
      <text x="32" y="20" font-size="12" fill="#7ff0e2">◉ 实时看板</text>
    </g>
    <text x="40" y="866" font-size="11" fill="#4e7197">SCHEMATIC PREVIEW · SYNTHETIC DEMO DATA · NO REAL USAGE DATA INCLUDED</text>
  </g>
</svg>
